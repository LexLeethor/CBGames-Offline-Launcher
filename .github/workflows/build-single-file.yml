name: Build Launcher Bundles

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
  push:
    paths:
      - "index.html"
      - "src/**"
      - "scripts/build_bundle.mjs"
      - ".github/workflows/build-single-file.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build debug bundle
        if: github.event_name == 'push'
        run: node scripts/build_bundle.mjs --out dist/index.debug.html

      - name: Build minified bundle
        if: github.event_name == 'push'
        run: node scripts/build_bundle.mjs --minify --out dist/index.min.html

      - name: Build release bundle (minified)
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/build_bundle.mjs --minify --out dist/index.html

      - name: Upload build artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cbgames-offline-launcher-bundles
          path: dist/*.html

      - name: Create release and upload asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: dist/index.html
