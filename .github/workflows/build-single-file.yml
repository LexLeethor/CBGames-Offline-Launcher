jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cbgl-playwright:latest

    steps:
      - name: Checkout
        uses: http://lex-pi.local:3002/lex/checkout@v4
        with:
          repository: lex/CBGames-Offline-Launcher
          ref: ${{ github.ref_name }}
          github_server_url: 'http://lex-pi.local:3002'

      - name: Build debug bundle
        if: github.event_name == 'push'
        run: node scripts/build_bundle.mjs --out dist/index.debug.html

      ...