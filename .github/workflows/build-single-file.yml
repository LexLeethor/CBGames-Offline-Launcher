name: Build Launcher Bundles

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g., 1.3.2)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cbgl-playwright:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Extractor Version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION_INPUT="${{ github.event.inputs.version }}"
          VERSION_CLEAN=$(echo "$VERSION_INPUT" | tr -d '.')
          echo "Updating CURRENT_EXTRACTOR_VERSION to $VERSION_CLEAN"
          sed -i "s/const CURRENT_EXTRACTOR_VERSION = [0-9]\+;/const CURRENT_EXTRACTOR_VERSION = ${VERSION_CLEAN};/" src/launch/launcher.js

      - name: Build debug bundle
        run: node scripts/build_bundle.mjs --out dist/index.debug.html

      - name: Build release bundle
        run: node scripts/build_bundle.mjs --minify --out dist/index.html

      - name: Upload Bundles
        uses: actions/upload-artifact@v3
        with:
          name: launcher-bundles
          path: |
            dist/index.debug.html
            dist/index.html

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          files: |
            dist/index.debug.html
            dist/index.html
          generate_release_notes: true
