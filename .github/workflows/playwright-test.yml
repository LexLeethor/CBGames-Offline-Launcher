name: Launcher Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Playwright (file://)
    runs-on: ubuntu-latest
    container:
      image: cbgl-playwright:latest

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: https://git.tail39ec93.ts.net/lex/checkout@v4
        with:
          repository: lex/CBGames-Offline-Launcher
          ref: ${{ github.ref_name }}
          github_server_url: 'https://git.tail39ec93.ts.net/'

      - name: Install dependencies
        run: npm ci

      - name: Build launcher bundle
        run: node scripts/build_bundle.mjs --out dist/index.debug.html

      - name: Run launcher autotest
        run: node playwright-launcher-test.mjs
        env:
          CI: "1"
          HEADLESS: "1"
          PAUSE_MS: "0"   