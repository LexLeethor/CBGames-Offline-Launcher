name: Launcher Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Playwright (file://)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: http://lex-pi.local:3002/lex/checkout@v4
        with:
          repository: lex/CBGames-Offline-Launcher
          ref: ${{ github.ref_name }}
          github_server_url: 'http://lex-pi.local:3002'

      - name: Setup Node.js
        uses: http://lex-pi.local:3002/lex/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build launcher bundle
        run: node scripts/build_bundle.mjs --out dist/index.debug.html

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run launcher autotest
        run: node playwright-launcher-test.mjs
        env:
          CI: "1"
          HEADLESS: "1"
          PAUSE_MS: "0"   